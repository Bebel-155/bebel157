name: Build and Publish Bebel 155

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: liberar
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir versao automatica
        id: version
        shell: pwsh
        run: |
          # O primeiro workflow falhou no run 1. O proximo push (run 2) gera 5.1.8.
          $patch = 6 + [int]"${{ github.run_number }}"
          $version = "5.1.$patch"
          $fileVersion = "V" + ($version -replace '\.','_')
          "version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT

          $src = "Bebel155_v5_1_8.cs"
          if (!(Test-Path $src)) { throw "Fonte nao encontrada: $src" }

          $text = Get-Content $src -Raw
          $text = $text -replace 'readonly string AppVersion = "[^"]+";', ('readonly string AppVersion = "' + $version + '";')
          $text = $text -replace 'footer.Text = "v[^"]+ • USB / Android / iOS";', ('footer.Text = "v' + $version + ' • USB / Android / iOS";')
          Set-Content -Path $src -Value $text -Encoding UTF8

          $iss = "Bebel155_v5_1_8.iss"
          if (!(Test-Path $iss)) { throw "Arquivo Inno Setup nao encontrado: $iss" }

          $i = Get-Content $iss -Raw
          $i = $i -replace '#define MyAppVersion "[^"]+"', ('#define MyAppVersion "' + $version + '"')
          $i = $i -replace '#define MyAppExeName "[^"]+"', ('#define MyAppExeName "Bebel-155_' + $fileVersion + '.exe"')
          $i = $i -replace 'OutputBaseFilename=.*', ('OutputBaseFilename=Bebel-155_Setup_' + $fileVersion)
          Set-Content -Path $iss -Value $i -Encoding UTF8

      - name: Validar arquivos do build
        shell: pwsh
        run: |
          $required = @(
            "Bebel155_v5_1_8.cs",
            "Bebel155_v5_1_8.iss",
            "Assets\bebel155.ico",
            "Assets\logo_b155.png",
            "Assets\banner_b155.png"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Arquivo obrigatorio ausente: $file"
            }
            $item = Get-Item $file
            Write-Host ("OK  {0}  ({1} bytes)" -f $item.FullName, $item.Length)
          }

      - name: Compilar EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null

          $fileVersion = "${{ steps.version.outputs.file_version }}"

          # Resolve todos os caminhos ANTES de montar os argumentos.
          # Isso evita o CS1566 causado pelas aspas dentro de /resource:.
          $source = (Resolve-Path "Bebel155_v5_1_8.cs").Path
          $icon = (Resolve-Path "Assets\bebel155.ico").Path
          $logo = (Resolve-Path "Assets\logo_b155.png").Path
          $banner = (Resolve-Path "Assets\banner_b155.png").Path
          $buildDir = (Resolve-Path "build").Path
          $exe = Join-Path $buildDir ("Bebel-155_" + $fileVersion + ".exe")

          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) {
            $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (!(Test-Path $csc)) {
            throw "csc.exe nao encontrado."
          }

          $frameworkDir = Split-Path $csc -Parent

          $references = @(
            "System.dll",
            "System.Core.dll",
            "System.Drawing.dll",
            "System.Windows.Forms.dll",
            "System.Management.dll",
            "System.IO.Compression.dll",
            "System.IO.Compression.FileSystem.dll"
          )

          $cscArgs = @(
            "/nologo",
            "/target:winexe",
            "/optimize+",
            "/platform:anycpu",
            "/codepage:65001",
            ("/out:" + $exe),
            ("/win32icon:" + $icon),
            ("/resource:" + $logo + ",Bebel155.Logo"),
            ("/resource:" + $banner + ",Bebel155.Banner")
          )

          foreach ($ref in $references) {
            $refPath = Join-Path $frameworkDir $ref
            if (!(Test-Path $refPath)) {
              throw "Referencia .NET ausente: $refPath"
            }
            $cscArgs += ("/reference:" + $refPath)
          }

          $cscArgs += $source

          Write-Host "Compilador: $csc"
          Write-Host "Fonte: $source"
          Write-Host "Logo: $logo"
          Write-Host "Banner: $banner"
          Write-Host "Saida: $exe"

          & $csc @cscArgs

          if ($LASTEXITCODE -ne 0) {
            throw "csc.exe terminou com codigo $LASTEXITCODE."
          }

          if (!(Test-Path $exe)) {
            throw "EXE nao criado: $exe"
          }

          Write-Host "EXE criado: $exe"

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compilar Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            throw "ISCC.exe nao encontrado."
          }

          & $iscc "Bebel155_v5_1_8.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao compilar Setup. Codigo: $LASTEXITCODE"
          }

          $fileVersion = "${{ steps.version.outputs.file_version }}"
          $setup = "dist\Bebel-155_Setup_$fileVersion.exe"
          if (!(Test-Path $setup)) {
            throw "Setup nao encontrado apos compilacao: $setup"
          }

      - name: Calcular SHA-256
        shell: pwsh
        run: |
          $fileVersion = "${{ steps.version.outputs.file_version }}"
          $exe = "build\Bebel-155_$fileVersion.exe"
          $setup = "dist\Bebel-155_Setup_$fileVersion.exe"

          if (!(Test-Path $exe)) { throw "EXE ausente: $exe" }
          if (!(Test-Path $setup)) { throw "Setup ausente: $setup" }

          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$exe.sha256"

          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$setup.sha256"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Bebel Equipe Do Mais Novo 155 v${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            Build automatico do Bebel 155.
            Commit: ${{ github.sha }}
          files: |
            build/Bebel-155_${{ steps.version.outputs.file_version }}.exe
            build/Bebel-155_${{ steps.version.outputs.file_version }}.exe.sha256
            dist/Bebel-155_Setup_${{ steps.version.outputs.file_version }}.exe
            dist/Bebel-155_Setup_${{ steps.version.outputs.file_version }}.exe.sha256
